services:
  appointment-service:
    build: ./appointment-service
    ports:
      - "4001:3000"
    environment:
      PORT: 3000
      AUDIT_LOG_DIR: /data
      BOOKING_LATENCY_MS: 250
    volumes:
      - audit-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  appointment-audit-sidecar:
    build: ./appointment-audit-sidecar
    ports:
      - "4003:3000"
    environment:
      PORT: 3000
      AUDIT_LOG_DIR: /data
      POLL_INTERVAL_MS: 3000
    volumes:
      - audit-data:/data
    depends_on:
      appointment-service:
        condition: service_healthy

  availability-service:
    build: ./availability-service
    ports:
      - "4002:3000"
    environment:
      PORT: 3000
      QUERY_LATENCY_MS: 200
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  audit-data:
